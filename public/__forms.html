<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Forms</title><meta name="robots" content="noindex" /></head>
  <body>
    <!-- Netlify Forms registration (Next.js runtime): the real form posts here from src/components/site/ContactForm.tsx. -->
    <form name="consultation" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="consultation" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" />
      <select name="service"><option value="">-</option></select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
